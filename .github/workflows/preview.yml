name: Automatic development preview
on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Tünel açık kalma süresi (saat, örn: 5.75)'
        required: false
        default: '5.75'
  schedule:
    - cron: '0 */5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: automatic-proxy-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install verified tunnel client
        run: |
          curl --fail --location --retry 3 --output /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          echo 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  /tmp/cloudflared' | sha256sum --check
          chmod 700 /tmp/cloudflared
      - name: Start bounded development preview
        env:
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          INPUT_DURATION_HOURS: ${{ github.event.inputs.duration_hours }}
        run: |
          if [ -n "$INPUT_DURATION_HOURS" ]; then
            DURATION_MS=$(node -e "const h = parseFloat(process.env.INPUT_DURATION_HOURS); console.log(Math.round(Math.min(350 * 60 * 1000, Math.max(60000, h * 3600000))))")
          else
            DURATION_MS=20700000
          fi
          export PREVIEW_DURATION_MS="$DURATION_MS"
          echo "PREVIEW_DURATION_MS: $PREVIEW_DURATION_MS"
          node scripts/preview-runner.mjs > /tmp/proxy-preview.log 2>&1 &
          echo $! > /tmp/proxy-preview.pid
          for attempt in $(seq 1 120); do
            if test -f /tmp/github-proxy-preview/info.json; then exit 0; fi
            if ! kill -0 "$(cat /tmp/proxy-preview.pid)" 2>/dev/null; then cat /tmp/proxy-preview.log; exit 1; fi
            sleep 2
          done
          cat /tmp/proxy-preview.log
          exit 1
      - name: Verify public application before publishing
        env:
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: node scripts/verify-preview.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build active portal
        env:
          PREVIEW_INFO: /tmp/github-proxy-preview/info.json
        run: node scripts/build-portal.mjs
      - name: Update README with live tunnel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/update-readme.mjs
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update live tunnel URL in README [skip ci]" || true
            git push origin main || true
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: portal-dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Automatic test window and hourly README refresh
        run: |
          # Her saat başı README'deki süreyi otomatik tazeleyen arka plan görevi
          (
            while true; do
              sleep 3600
              if [ ! -f /tmp/github-proxy-preview/info.json ]; then break; fi
              git pull --rebase origin main || true
              node scripts/update-readme.mjs
              if ! git diff --quiet README.md; then
                git add README.md
                git commit -m "chore: refresh remaining time in README [skip ci]" || true
                git push origin main || true
              fi
            done
          ) &
          HOURLY_PID=$!

          # Oturum süresi boyunca bekle
          node --input-type=module -e "import {readFile} from 'node:fs/promises';const info=JSON.parse(await readFile('/tmp/github-proxy-preview/info.json','utf8'));await new Promise(r=>setTimeout(r,Math.max(0,Date.parse(info.expiresAt)-Date.now())));"
          kill "$HOURLY_PID" 2>/dev/null || true
      - name: Trigger next run automatically
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "Triggering next preview run to keep preview running..."
            gh workflow run preview.yml --repo "$GITHUB_REPOSITORY" || true
          fi
      - name: Stop preview
        if: always()
        run: |
          if test -f /tmp/proxy-preview.pid; then kill "$(cat /tmp/proxy-preview.pid)" 2>/dev/null || true; fi
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-diagnostics
          path: artifacts/preview-diagnostics/
          retention-days: 1
          if-no-files-found: ignore
      - name: Build closed portal
        if: success()
        run: node scripts/build-portal.mjs
      - name: Upload closed portal
        if: success()
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: portal-dist
          name: github-pages-closed
      - name: Publish closed portal
        if: success()
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-closed

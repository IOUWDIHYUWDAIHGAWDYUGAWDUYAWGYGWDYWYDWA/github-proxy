services:
  proxy:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - '127.0.0.1:8787:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
